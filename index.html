<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ear Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#171B26; --panel:#1F2533; --edge:#333B4F;
    --bone:#EAE7DF; --muted:#959DB3;
    --human:#E3A24A; --ai:#56C4D8;
    --right:#7FC48C; --wrong:#E0717A;
    --display:"Bricolage Grotesque","Trebuchet MS",sans-serif;
    --ui:"Instrument Sans","Segoe UI",system-ui,sans-serif;
  }
  :root[data-theme="light"]{
    --base:#E7E3D9; --panel:#F6F4EE; --edge:#CFC8B8;
    --bone:#1B2030; --muted:#5E6577;
    --human:#9A5E12; --ai:#0F6E7E;
    --right:#2F6E3D; --wrong:#A83540;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--base); color:var(--bone);
    font-family:var(--ui); font-size:16px; line-height:1.5;
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    padding:max(20px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
    -webkit-tap-highlight-color:transparent; -webkit-text-size-adjust:100%;
  }
  .shell{width:100%; max-width:620px}

  .top{display:flex; align-items:baseline; justify-content:space-between; gap:16px; margin-bottom:22px}
  .count{font-family:var(--display); font-weight:500; font-size:15px; letter-spacing:.01em}
  .pips{display:flex; gap:7px; list-style:none; margin:0; padding:0}
  .pips li{width:9px; height:9px; border-radius:50%; border:1.5px solid var(--edge)}
  .pips li.hit{background:var(--right); border-color:var(--right)}
  .pips li.miss{background:var(--wrong); border-color:var(--wrong)}

  .stage{
    background:var(--panel); border:1px solid var(--edge);
    border-radius:20px; padding:26px 22px 20px;
  }
  #viz{display:block; width:100%; height:132px}

  .transport{display:flex; align-items:center; gap:14px; margin-top:18px}
  .play{
    flex:none; width:52px; height:52px; border-radius:50%;
    background:var(--bone); color:var(--panel); border:0; cursor:pointer;
    display:grid; place-items:center; transition:transform .12s ease;
  }
  .play:hover{transform:scale(1.05)}
  .play svg{width:20px; height:20px; fill:currentColor}
  .seek{flex:1; padding:9px 0; cursor:pointer; touch-action:none}
  .rail{height:6px; border-radius:99px; background:var(--edge)}
  .fill{height:100%; width:0; border-radius:99px; background:var(--bone)}
  .time{font-variant-numeric:tabular-nums; font-size:14px; color:var(--muted); min-width:34px}

  .prompt{margin:26px 0 12px; font-family:var(--display); font-weight:800; font-size:clamp(26px,6vw,36px); line-height:1.1; letter-spacing:-.02em}
  .choose{display:grid; grid-template-columns:1fr 1fr; gap:12px}
  .pick{
    font-family:var(--display); font-weight:500; font-size:19px; color:var(--bone);
    background:transparent; border:1.5px solid var(--edge); border-radius:14px;
    padding:18px 10px; min-height:60px; cursor:pointer; transition:border-color .15s ease, background .15s ease;
  }
  .pick:hover:not(:disabled){background:var(--edge)}
  .pick[data-pick="human"]:hover:not(:disabled){border-color:var(--human)}
  .pick[data-pick="ai"]:hover:not(:disabled){border-color:var(--ai)}
  .pick:disabled{opacity:.4; cursor:default}
  .pick.chosen{opacity:1; border-width:2px}
  .pick.chosen[data-pick="human"]{border-color:var(--human)}
  .pick.chosen[data-pick="ai"]{border-color:var(--ai)}

  .reveal{margin-top:18px}
  .verdict{font-family:var(--display); font-weight:800; font-size:22px; margin:0 0 4px}
  .verdict.hit{color:var(--right)}
  .verdict.miss{color:var(--wrong)}
  .detail{margin:0 0 16px; color:var(--muted); font-size:15px}
  .next, .again{
    font-family:var(--ui); font-weight:600; font-size:16px;
    background:var(--bone); color:var(--base); border:0; border-radius:12px;
    padding:13px 22px; cursor:pointer;
  }

  .results h2{font-family:var(--display); font-weight:800; font-size:clamp(30px,7vw,42px); line-height:1.05; letter-spacing:-.02em; margin:0 0 6px}
  .best{color:var(--muted); margin:0 0 22px}
  .recap{list-style:none; margin:0 0 24px; padding:0; border-top:1px solid var(--edge)}
  .recap li{display:flex; align-items:center; gap:12px; padding:11px 2px; border-bottom:1px solid var(--edge); font-size:15px}
  .mark{flex:none; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font-size:13px; color:var(--base)}
  .mark.hit{background:var(--right)}
  .mark.miss{background:var(--wrong)}
  .recap .truth{font-weight:600}
  .recap .said{color:var(--muted); margin-left:auto}

  .intro h1{font-family:var(--display); font-weight:800; font-size:clamp(32px,9vw,46px); line-height:1.02; letter-spacing:-.025em; margin:0 0 10px}
  .intro p{margin:0 0 22px; color:var(--muted); max-width:42ch}
  .field{display:block; margin-bottom:14px}
  .field span{display:block; font-size:14px; color:var(--muted); margin-bottom:7px}
  .field input{
    width:100%; font-family:var(--ui); font-size:16px; color:var(--bone);
    background:var(--panel); border:1.5px solid var(--edge); border-radius:12px; padding:14px 15px;
  }
  .field input:focus{outline:none; border-color:var(--bone)}
  .saved{font-size:13px; color:var(--muted); margin:16px 0 0}
  [hidden]{display:none !important}
  button:focus-visible, .seek:focus-visible{outline:2px solid var(--bone); outline-offset:3px}
  .hint{margin:18px 0 0; font-size:13px; color:var(--muted)}
  @media (pointer:coarse){ .hint{display:none} }
  @media (max-width:430px){
    .stage{padding:18px 14px 14px; border-radius:16px}
    #viz{height:96px}
    .prompt{margin:22px 0 10px}
    .pick{font-size:17px; padding:16px 8px}
    .play{width:56px; height:56px}
    .recap li{flex-wrap:wrap; gap:8px}
    .recap .said{margin-left:0; width:100%; padding-left:34px}
  }
  @media (prefers-reduced-motion:reduce){ .play{transition:none} }
</style>
</head>
<body>
<main class="shell">
  <div class="intro" id="intro">
    <h1>Can you hear the difference?</h1>
    <p>Five short clips, one at a time. After each one, say whether a person made it or a machine did. Nothing is saved and no sign-in is needed.</p>
    <button class="again" id="startBtn">Start listening</button>
  </div>

  <div id="game" hidden>
    <header class="top">
      <p class="count">Clip <span id="roundNum">1</span> of <span id="roundTotal">5</span></p>
      <ol class="pips" id="pips"></ol>
    </header>

    <section class="stage">
      <canvas id="viz"></canvas>
      <div class="transport">
        <button class="play" id="playBtn" aria-label="Play clip">
          <svg id="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        </button>
        <div class="seek" id="seek" role="slider" tabindex="0" aria-label="Clip position" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div class="rail"><div class="fill" id="fill"></div></div></div>
        <span class="time" id="time">0:00</span>
      </div>
    </section>

    <h1 class="prompt">Who made this?</h1>
    <section class="choose">
      <button class="pick" data-pick="human">Human</button>
      <button class="pick" data-pick="ai">AI</button>
    </section>

    <section class="reveal" id="reveal" hidden aria-live="polite">
      <p class="verdict" id="verdict"></p>
      <p class="detail" id="detail"></p>
      <button class="next" id="nextBtn">Next clip</button>
    </section>
    <p class="hint">Keys: space plays, H and A answer.</p>
  </div>

  <div class="results" id="results" hidden>
    <h2 id="finalScore"></h2>
    <p class="best" id="bestLine"></p>
    <ol class="recap" id="recap"></ol>
    <button class="again" id="againBtn">Play again</button>
  </div>
</main>
<audio id="audio" preload="auto"></audio>

<script>
const TRACKS = [
  { id:'000207', file:'000207.mp3', label:'human', note:'' },
  { id:'000141', file:'000141.mp3', label:'ai',    note:'' },
  { id:'000194', file:'000194.mp3', label:'human', note:'' },
  { id:'000620', file:'000620.mp3', label:'ai',    note:'' },
  { id:'000574', file:'000574.mp3', label:'human', note:'' },
];
// To change the set: drop an .mp3 into audio/ and add or edit a line above.
// label must be 'human' or 'ai' — it is the answer key.
// note is optional; it shows on the reveal after someone answers.
// Any number of clips works; the counter, pips and recap all follow this list.

const $ = id => document.getElementById(id);
const audio = $('audio');
let deck = [], idx = 0, answers = [], locked = false;

// Pull the next clip into cache while this one is being judged.
function prefetch(i){
  const t = deck[i];
  if(!t) return;
  const a = new Audio(); a.preload = 'auto'; a.src = 'audio/' + t.file;
}
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---- visualiser ---- */
const canvas = $('viz'), cx = canvas.getContext('2d');
let actx, analyser, bins, raf, level = new Float32Array(40);
function sizeCanvas(){
  const r = window.devicePixelRatio || 1, w = canvas.clientWidth, h = canvas.clientHeight;
  canvas.width = w*r; canvas.height = h*r; cx.setTransform(r,0,0,r,0,0);
}
function audioGraph(){
  if(actx) return;
  try{
    actx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = actx.createAnalyser();
    analyser.fftSize = 128; analyser.smoothingTimeConstant = .82;
    actx.createMediaElementSource(audio).connect(analyser);
    analyser.connect(actx.destination);
    bins = new Uint8Array(analyser.frequencyBinCount);
  }catch(e){ analyser = null; }
}
function startLoop(){ if(!raf) raf = requestAnimationFrame(render); }
function render(){
  raf = requestAnimationFrame(render);
  const w = canvas.clientWidth, h = canvas.clientHeight, n = level.length;
  if(analyser && !audio.paused) analyser.getByteFrequencyData(bins);
  const style = getComputedStyle(document.documentElement);
  cx.clearRect(0,0,w,h);
  const gap = 3, bw = (w - gap*(n-1))/n, mid = h/2;
  for(let i=0;i<n;i++){
    const src = (analyser && !audio.paused) ? bins[Math.floor(i*bins.length/n/1.6)]/255 : 0;
    level[i] += (src - level[i]) * (src > level[i] ? .5 : .12);
    const bh = Math.max(2, level[i]*level[i]*h*0.92);
    cx.fillStyle = style.getPropertyValue('--bone').trim();
    cx.globalAlpha = .28 + level[i]*.72;
    cx.beginPath();
    cx.roundRect(i*(bw+gap), mid-bh/2, bw, bh, bw/2);
    cx.fill();
  }
  cx.globalAlpha = 1;
  if(audio.paused && Math.max.apply(null, Array.from(level)) < .004){
    cancelAnimationFrame(raf); raf = null;
  }
}

/* ---- rounds ---- */
function loadRound(){
  const t = deck[idx];
  locked = false;
  audio.src = 'audio/' + t.file; audio.currentTime = 0;
  prefetch(idx+1);
  $('roundNum').textContent = idx+1;
  $('fill').style.width = '0%'; $('time').textContent = '0:00';
  $('reveal').hidden = true;
  document.querySelectorAll('.pick').forEach(b => { b.disabled = false; b.classList.remove('chosen'); });
  setIcon(false);
}
function answer(pick){
  if(locked) return;
  locked = true;
  const t = deck[idx], hit = pick === t.label;
  answers.push({ id:t.id, track:idx+1, truth:t.label, pick, hit });
  document.querySelectorAll('.pick').forEach(b => {
    b.disabled = true;
    if(b.dataset.pick === pick) b.classList.add('chosen');
  });
  const pip = $('pips').children[idx];
  pip.classList.add(hit ? 'hit' : 'miss');
  const v = $('verdict');
  v.textContent = hit ? 'Correct' : 'Not this one';
  v.className = 'verdict ' + (hit ? 'hit' : 'miss');
  const name = t.label === 'ai' ? 'generated by AI' : 'made by a person';
  const base = 'Track ' + (idx+1) + ' was ' + name + '.';
  $('detail').textContent = t.note ? base + ' ' + t.note : base;
  $('nextBtn').textContent = idx === deck.length-1 ? 'See results' : 'Next clip';
  $('reveal').hidden = false;
  $('nextBtn').focus();
}
function next(){
  audio.pause(); setIcon(false);
  if(idx === deck.length-1) return finish();
  idx++; loadRound();
}
function finish(){
  const score = answers.filter(a => a.hit).length;
  $('game').hidden = true; $('results').hidden = false;
  $('finalScore').textContent = score + ' of ' + deck.length + ' right';
  const pct = score / deck.length;
  const lines = pct === 1 ? 'A clean sweep.'
    : pct >= .8 ? 'Sharp listening.'
    : pct >= .6 ? 'Better than a coin toss.'
    : pct >= .4 ? 'Close calls throughout.'
    : 'Tough round \u2014 these clips are close.';
  $('bestLine').textContent = lines;
  $('recap').innerHTML = answers.map(a =>
    '<li><span class="mark ' + (a.hit?'hit':'miss') + '">' + (a.hit?'\u2713':'\u2715') + '</span>' +
    '<span class="truth">' + (a.truth === 'ai' ? 'AI' : 'Human') + '</span>' +
    '<span>Track ' + a.track + '</span>' +
    '<span class="said">you said ' + (a.pick === 'ai' ? 'AI' : 'Human') + '</span></li>').join('');
  $('againBtn').focus();
}
function start(){
  deck = shuffle(TRACKS); idx = 0; answers = []; 
  $('roundTotal').textContent = deck.length;
  $('pips').innerHTML = deck.map(() => '<li></li>').join('');
  $('results').hidden = true; $('intro').hidden = true; $('game').hidden = false;
  sizeCanvas(); render();
  loadRound();
}

/* ---- transport ---- */
function setIcon(playing){
  $('icon').innerHTML = playing ? '<path d="M6 5h4v14H6zm8 0h4v14h-4z"/>' : '<path d="M8 5v14l11-7z"/>';
  $('playBtn').setAttribute('aria-label', playing ? 'Pause clip' : 'Play clip');
}
function toggle(){
  audioGraph();
  if(actx && actx.state === 'suspended') actx.resume();
  if(audio.paused) audio.play().catch(()=>{}); else audio.pause();
}
audio.addEventListener('play', () => { setIcon(true); startLoop(); });
audio.addEventListener('pause', () => setIcon(false));
audio.addEventListener('ended', () => setIcon(false));
audio.addEventListener('timeupdate', () => {
  const p = audio.duration ? audio.currentTime/audio.duration*100 : 0;
  $('fill').style.width = p + '%';
  $('seek').setAttribute('aria-valuenow', Math.round(p));
  const s = Math.floor(audio.currentTime);
  $('time').textContent = Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
});
$('playBtn').addEventListener('click', toggle);
function seekTo(clientX){
  const r = $('seek').getBoundingClientRect();
  if(!audio.duration) return;
  const p = Math.min(1, Math.max(0, (clientX - r.left)/r.width));
  audio.currentTime = p * audio.duration;
}
let dragging = false;
$('seek').addEventListener('pointerdown', e => { dragging = true; $('seek').setPointerCapture(e.pointerId); seekTo(e.clientX); });
$('seek').addEventListener('pointermove', e => { if(dragging) seekTo(e.clientX); });
$('seek').addEventListener('pointerup', () => { dragging = false; });
$('seek').addEventListener('pointercancel', () => { dragging = false; });
$('seek').addEventListener('keydown', e => {
  if(e.key === 'ArrowRight') audio.currentTime = Math.min(audio.duration||0, audio.currentTime+5);
  if(e.key === 'ArrowLeft') audio.currentTime = Math.max(0, audio.currentTime-5);
});
document.querySelectorAll('.pick').forEach(b => b.addEventListener('click', () => answer(b.dataset.pick)));
$('nextBtn').addEventListener('click', next);
$('againBtn').addEventListener('click', start);
$('startBtn').addEventListener('click', start);
document.addEventListener('keydown', e => {
  if(e.target.tagName === 'INPUT') return;
  if(e.target.tagName === 'BUTTON' && e.key === ' ') return;
  if(e.key === ' '){ e.preventDefault(); if(!$('game').hidden) toggle(); }
  if(!locked && !$('game').hidden){
    if(e.key === 'h' || e.key === 'H') answer('human');
    if(e.key === 'a' || e.key === 'A') answer('ai');
  }
});
window.addEventListener('resize', sizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(sizeCanvas, 120));
sizeCanvas();
</script>
</body>
</html>
